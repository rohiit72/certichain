services:
  postgres:
    image: postgres:16
    container_name: certichain
    restart: unless-stopped
    environment:
      POSTGRES_DB: certichain
      POSTGRES_USER: certichain
      POSTGRES_PASSWORD: certichain_password
    ports:
      - "5432:5432"
    volumes:
      - certichain_postgres_data:/var/lib/postgresql/data

volumes:
  certichain_postgres_data: